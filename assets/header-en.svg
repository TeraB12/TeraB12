<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Mateo Pereyra, full-stack developer, Cordoba Argentina. I design, build and operate systems in production.">
  <title>Mateo Pereyra, full-stack developer</title>

  <defs>
    <style>
      .mono  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .sans  { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }

      .eyebrow { font-size: 12px; letter-spacing: 2.6px; fill: #E9B23E; }
      .name    { font-size: 92px; font-weight: 800; letter-spacing: -3.6px; fill: #F4F1EA; }
      .subline { font-size: 25px; font-weight: 400; letter-spacing: -0.4px; fill: #B6B1A8; }
      .key     { font-size: 9.5px; letter-spacing: 1.9px; fill: #6B6862; }
      .val     { font-size: 13px; letter-spacing: 0.6px; fill: #F4F1EA; }
      .chip    { font-size: 11px; letter-spacing: 2.1px; fill: #807C74; }

      /* The heartbeat: a gold pulse travelling the trace. Same signature as the site. */
      .ecg-live {
        stroke-dasharray: 78 1000;
        animation: sweep 4.6s cubic-bezier(.16,1,.3,1) infinite;
      }
      @keyframes sweep {
        from { stroke-dashoffset: 1078; }
        to   { stroke-dashoffset: 0; }
      }

      .beat { animation: beat 4.6s cubic-bezier(.16,1,.3,1) infinite; }
      @keyframes beat {
        0%, 100% { opacity: .35; r: 4; }
        46%      { opacity: .35; r: 4; }
        52%      { opacity: 1;   r: 6; }
        70%      { opacity: .35; r: 4; }
      }
    </style>

    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 V340" stroke="#F4F1EA" stroke-opacity=".035" stroke-width="1"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#0A0A08" stop-opacity="0"/>
      <stop offset=".72" stop-color="#0A0A08" stop-opacity="0"/>
      <stop offset="1"   stop-color="#0A0A08" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background: warm black, never blue -->
  <rect width="1280" height="340" fill="#0A0A08"/>
  <rect width="1280" height="340" fill="url(#grid)"/>

  <!-- 1px frame -->
  <path d="M0 .5 H1280 M0 339.5 H1280" stroke="#F4F1EA" stroke-opacity=".11" stroke-width="1"/>

  <!-- ============ LEFT BLOCK ============ -->
  <text class="mono eyebrow" x="64" y="52">FULL-STACK DEVELOPER · CORDOBA, ARGENTINA</text>

  <text class="sans name" x="60" y="152">MATEO PEREYRA</text>

  <text class="sans subline" x="64" y="196">I design, build and operate systems in production.</text>

  <!-- ============ RIGHT PANEL (instrument readout) ============ -->
  <path d="M980.5 30 V202" stroke="#F4F1EA" stroke-opacity=".11" stroke-width="1"/>

  <text class="mono key" x="1012" y="52">STATUS</text>
  <circle cx="1016" cy="71" r="4" fill="#5AC98A" class="beat"/>
  <text class="mono val" x="1028" y="76" fill="#5AC98A">OPERATIONAL</text>

  <text class="mono key" x="1012" y="118">COMPANY</text>
  <text class="mono val" x="1012" y="140">PULSO SOFTWARE</text>

  <text class="mono key" x="1012" y="176">CERTIFICATIONS</text>
  <text class="mono val" x="1012" y="198">12 · DIPLOMA IN PROGRESS</text>

  <!-- ============ THE HEARTBEAT ============ -->
  <!-- Base trace, dimmed -->
  <path id="ecg"
        d="M64,252 H340 l14,-10 l12,20 l14,-10 H520 l10,0 l9,12 l11,-76 l12,86 l11,-28 l9,6 H840 l14,-10 l12,20 l14,-10 H1010 l10,0 l9,12 l11,-76 l12,86 l11,-28 l9,6 H1216"
        fill="none" stroke="#F4F1EA" stroke-opacity=".13" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round" pathLength="1000"/>
  <!-- Live pulse, gold -->
  <use href="#ecg" class="ecg-live" stroke="#E9B23E" stroke-opacity="1" stroke-width="1.8"/>

  <!-- ============ FOOTER ============ -->
  <path d="M64 292.5 H1216" stroke="#F4F1EA" stroke-opacity=".11" stroke-width="1"/>

  <text class="mono chip" x="64" y="318">NEXT.JS · TYPESCRIPT · NESTJS · PRISMA · POSTGRESQL · REDIS</text>
  <text class="mono chip" x="1216" y="318" text-anchor="end" fill="#E9B23E">PULSOSOFTWARE.COM</text>
</svg>
